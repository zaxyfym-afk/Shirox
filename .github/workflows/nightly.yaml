# shamelessly copied from https://github.com/cranci1/Luna/blob/main/.github/workflows/build.yml

name: Build and upload nightly

on:
 push:
   branches:
     - main
 schedule:
   # The macOS pool starves at European peak: seven runs queued between 14:09
   # and 17:07 UTC on 2026-11-20 were all cancelled after ~15 minutes with no
   # runner ever assigned, while every success this month landed between 23:30
   # and 02:41 UTC. Two builds a day sit in quiet windows: 21:07 UTC (European
   # night) and 03:07 UTC (both quiet, and off the round-minute load spikes).
   - cron: '7 21 * * *'
   - cron: '7 3 * * *'
 workflow_dispatch:

# Two merges in a row used to build side by side and race for apps.json and the release.
# Runs now wait for each other; a newer push replaces one that is still waiting.
concurrency:
 group: nightly
 cancel-in-progress: false

env:
 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
 # The release every build lands in. It was "beta", a pre-release named "First".
 RELEASE_TAG: latest

jobs:
 prepare-release:
   name: Prepare release
   runs-on: ubuntu-latest
   permissions:
     contents: write
   steps:
     - name: Checkout repository
       uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

     # The tag follows main, so the release's source is the commit its builds came from.
     - name: Move the release tag to this commit
       run: |
         git tag -f "$RELEASE_TAG"
         git push -f origin "refs/tags/$RELEASE_TAG"

     # Made once here, before the builds, which upload to it side by side.
     - name: Create the release if it's missing
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: |
         gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
           gh release create "$RELEASE_TAG" --verify-tag --title "Shirox" --notes "Building…" --latest

 build-ios:
   name: Build iOS IPA
   needs: prepare-release
   # macos-26's pool starves at peak (the cron note above); macos-15's is a
   # different queue. Its image default Xcode is 16.4, too old for the iOS 26
   # availability guards, so the newest Xcode the runner ships is picked at run
   # time instead of a hand-pinned version: the pin sat at 26.3 while the image
   # moved on, and the same green code failed only under that older toolchain.
   runs-on: macos-15
   permissions:
     contents: write
   steps:
     - name: Checkout repository
       uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

     - name: Select the newest Xcode on the runner
       run: |
         NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
         echo "Using $NEWEST"
         echo "DEVELOPER_DIR=$NEWEST/Contents/Developer" >> "$GITHUB_ENV"
         "$NEWEST/Contents/Developer/usr/bin/xcodebuild" -version

     - name: Make build script executable
       run: chmod +x ./buildipa.sh

     - name: Build iOS IPA
       run: ./buildipa.sh

     - name: Upload IPA
       uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
       with:
         name: Shirox-Nightly-IPA
         path: build/Shirox.ipa

     - name: Upload IPA to the release
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: gh release upload "$RELEASE_TAG" build/Shirox.ipa --clobber

     - name: Update apps.json
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: |
         IPA_SIZE=$(wc -c < build/Shirox.ipa | tr -d ' ')
         BUILD_DATE=$(date -u +%Y-%m-%d)
         git config user.name "github-actions[bot]"
         git config user.email "github-actions[bot]@users.noreply.github.com"
         # main often moves while the IPA builds (two PRs merged a minute apart), so the
         # edit is made on top of the newest main each try instead of the commit that was built.
         for attempt in 1 2 3 4 5; do
           git fetch origin main
           git checkout -B apps-json-update origin/main
           jq --argjson size "$IPA_SIZE" --arg date "$BUILD_DATE" \
             '.apps[0].versions[0].size = $size | .apps[0].versions[0].date = $date' \
             apps.json > apps.json.tmp && mv apps.json.tmp apps.json
           git add apps.json
           if git diff --cached --quiet; then exit 0; fi
           git commit -m "chore: update apps.json [skip ci]"
           if git push origin HEAD:main; then exit 0; fi
           sleep $((attempt * 5))
         done
         exit 1

 publish-release:
   name: Publish release
   needs: [build-ios]
   runs-on: ubuntu-latest
   permissions:
     contents: write
   steps:
     - name: Checkout repository
       uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

     # Named and described from apps.json's newest version, a full release rather than a
     # pre-release, and the one GitHub shows as Latest.
     - name: Name and publish the release
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: |
         VERSION=$(jq -r '.apps[0].versions[0].version' apps.json)
         BUILD=$(jq -r '.apps[0].versions[0].buildVersion' apps.json)
         jq -r '.apps[0].versions[0].localizedDescription' apps.json > notes.md
         printf '\n\n**Downloads:** Shirox.ipa (iPhone, iPad).\n' >> notes.md
         gh release edit "$RELEASE_TAG" \
           --title "Shirox $VERSION ($BUILD)" \
           --notes-file notes.md \
           --prerelease=false \
           --draft=false \
           --latest
